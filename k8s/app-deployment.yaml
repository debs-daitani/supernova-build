---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supernova-app
  namespace: supernova
  labels:
    app: supernova-ai
    component: application
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: supernova-ai
      component: application
  template:
    metadata:
      labels:
        app: supernova-ai
        component: application
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      # Use anti-affinity to spread pods across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - supernova-ai
              topologyKey: kubernetes.io/hostname

      # Service account for RBAC
      serviceAccountName: supernova-sa

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      # Init container to wait for database
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z postgres-service 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: wait-for-redis
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z redis-service 6379; do
            echo "Waiting for Redis..."
            sleep 2
          done
          echo "Redis is ready!"

      containers:
      - name: supernova-app
        image: supernova-ai:latest  # Update with your registry
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP

        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: supernova-config

        # Sensitive environment variables from Secret
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: supernova-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: supernova-secrets
              key: DB_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: supernova-secrets
              key: REDIS_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: supernova-secrets
              key: JWT_SECRET
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: supernova-secrets
              key: SESSION_SECRET
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: supernova-secrets
              key: API_KEY
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: supernova-secrets
              key: OPENAI_API_KEY
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: supernova-secrets
              key: ANTHROPIC_API_KEY
              optional: true

        # Volume mounts
        volumeMounts:
        - name: logs
          mountPath: /app/logs

        # Resource limits and requests
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1

        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1

        # Startup probe for slow-starting applications
        startupProbe:
          httpGet:
            path: /health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
          successThreshold: 1

        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL

      volumes:
      - name: logs
        emptyDir: {}

      # DNS configuration
      dnsPolicy: ClusterFirst

      # Restart policy
      restartPolicy: Always

      # Termination grace period
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: supernova-service
  namespace: supernova
  labels:
    app: supernova-ai
    component: application
spec:
  type: ClusterIP
  sessionAffinity: ClientIP  # Sticky sessions for better caching
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: supernova-ai
    component: application

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: supernova-sa
  namespace: supernova
  labels:
    app: supernova-ai

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: supernova-role
  namespace: supernova
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: supernova-rolebinding
  namespace: supernova
subjects:
- kind: ServiceAccount
  name: supernova-sa
  namespace: supernova
roleRef:
  kind: Role
  name: supernova-role
  apiGroup: rbac.authorization.k8s.io
