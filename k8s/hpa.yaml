---
# Horizontal Pod Autoscaler for automatic scaling
# Requires metrics-server to be installed in the cluster
# Install metrics-server: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: supernova-app-hpa
  namespace: supernova
  labels:
    app: supernova-ai
    component: application
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: supernova-app

  minReplicas: 3
  maxReplicas: 10

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60  # 1 minute
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
      selectPolicy: Max

  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

  # Custom metrics (uncomment if using Prometheus adapter)
  # - type: Pods
  #   pods:
  #     metric:
  #       name: http_requests_per_second
  #     target:
  #       type: AverageValue
  #       averageValue: "1000"

---
# Vertical Pod Autoscaler (Optional)
# Requires VPA controller to be installed
# Useful for right-sizing resource requests/limits

apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: supernova-app-vpa
  namespace: supernova
  labels:
    app: supernova-ai
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: supernova-app
  updatePolicy:
    updateMode: "Auto"  # Can be "Off", "Initial", or "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: supernova-app
      minAllowed:
        cpu: 100m
        memory: 128Mi
      maxAllowed:
        cpu: 2000m
        memory: 2Gi
      controlledResources:
      - cpu
      - memory

---
# Pod Disruption Budget for high availability
# Ensures minimum pods are available during voluntary disruptions

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: supernova-app-pdb
  namespace: supernova
  labels:
    app: supernova-ai
spec:
  minAvailable: 2  # At least 2 pods must be available
  # Or use: maxUnavailable: 1
  selector:
    matchLabels:
      app: supernova-ai
      component: application
