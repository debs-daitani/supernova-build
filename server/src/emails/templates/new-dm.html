<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Direct Message</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f4f4f4; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header { background: #667eea; color: white; padding: 30px 20px; text-align: center; }
    .header h1 { margin: 0; font-size: 24px; }
    .content { padding: 40px 30px; }
    .message-box { background: #f8f9fa; padding: 20px; border-left: 4px solid #667eea; border-radius: 4px; margin: 20px 0; }
    .message-box .sender { font-weight: 600; color: #667eea; margin-bottom: 10px; }
    .message-box .preview { color: #555; font-style: italic; }
    .cta { text-align: center; margin: 30px 0; }
    .cta a { display: inline-block; background: #667eea; color: white; padding: 14px 32px; text-decoration: none; border-radius: 8px; font-weight: 600; }
    .footer { background: #f8f9fa; padding: 20px; text-align: center; font-size: 14px; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>New Message 💌</h1>
    </div>
    <div class="content">
      <p>Hi {{name}},</p>
      <p>You have a new direct message!</p>

      <div class="message-box">
        <div class="sender">From: {{senderName}}</div>
        <div class="preview">"{{messagePreview}}"</div>
      </div>

      <div class="cta">
        <a href="{{messagesUrl}}">Read & Reply</a>
      </div>

      <p>Keep the conversation going! 💬</p>

      <p>Best,<br><strong>The dAItaniverse Team</strong></p>
    </div>
    <div class="footer">
      The dAItaniverse | Body • Brain • Business
    </div>
  </div>
</body>
</html>
