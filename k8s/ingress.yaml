---
# Ingress resource for HTTP/HTTPS routing
# Requires an Ingress Controller (nginx, traefik, etc.)
# Install nginx-ingress: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.1/deploy/static/provider/cloud/deploy.yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supernova-ingress
  namespace: supernova
  labels:
    app: supernova-ai
  annotations:
    # Nginx Ingress Controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "10"

    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"

    # Body size limits
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    # CORS (uncomment if needed)
    # nginx.ingress.kubernetes.io/enable-cors: "true"
    # nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    # nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    # nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"

    # SSL/TLS with cert-manager (uncomment if using cert-manager)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # cert-manager.io/acme-challenge-type: "http01"

    # Additional security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";

spec:
  ingressClassName: nginx  # Use your ingress class name

  # TLS configuration
  tls:
  - hosts:
    - supernova-ai.example.com  # Replace with your domain
    - api.supernova-ai.example.com
    secretName: supernova-tls-cert  # TLS certificate secret

  rules:
  # Main application domain
  - host: supernova-ai.example.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: supernova-service
            port:
              number: 80

  # API subdomain
  - host: api.supernova-ai.example.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: supernova-service
            port:
              number: 80

---
# TLS Certificate Secret (if not using cert-manager)
# Create this manually with your certificate:
# kubectl create secret tls supernova-tls-cert \
#   --namespace=supernova \
#   --cert=path/to/tls.crt \
#   --key=path/to/tls.key

# Or use cert-manager to automatically provision Let's Encrypt certificates:
# apiVersion: cert-manager.io/v1
# kind: Certificate
# metadata:
#   name: supernova-tls-cert
#   namespace: supernova
# spec:
#   secretName: supernova-tls-cert
#   issuerRef:
#     name: letsencrypt-prod
#     kind: ClusterIssuer
#   dnsNames:
#   - supernova-ai.example.com
#   - api.supernova-ai.example.com
