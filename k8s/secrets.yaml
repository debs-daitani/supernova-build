---
# IMPORTANT: This is a template file. DO NOT commit actual secrets to version control.
# In production, create secrets using kubectl or a secrets management system like:
# - Sealed Secrets
# - External Secrets Operator
# - HashiCorp Vault
# - AWS Secrets Manager
# - Azure Key Vault
# - Google Secret Manager

apiVersion: v1
kind: Secret
metadata:
  name: supernova-secrets
  namespace: supernova
  labels:
    app: supernova-ai
type: Opaque
stringData:
  # Database Credentials (Base64 encode in production)
  DB_USER: "supernova"
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # Redis Password
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # Security Secrets (MUST be changed in production)
  JWT_SECRET: "CHANGE_ME_TO_RANDOM_32_CHAR_STRING"
  SESSION_SECRET: "CHANGE_ME_TO_RANDOM_32_CHAR_STRING"
  API_KEY: "CHANGE_ME_IN_PRODUCTION"

  # AI Service API Keys
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

  # SMTP Configuration (if needed)
  SMTP_USER: ""
  SMTP_PASSWORD: ""

  # S3/Storage Credentials (if needed)
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""

---
# Example: How to create secrets from command line
# kubectl create secret generic supernova-secrets \
#   --namespace=supernova \
#   --from-literal=DB_USER=supernova \
#   --from-literal=DB_PASSWORD=your-secure-password \
#   --from-literal=REDIS_PASSWORD=your-redis-password \
#   --from-literal=JWT_SECRET=$(openssl rand -base64 32) \
#   --from-literal=SESSION_SECRET=$(openssl rand -base64 32) \
#   --from-literal=API_KEY=$(openssl rand -hex 32) \
#   --from-literal=OPENAI_API_KEY=sk-your-key \
#   --from-literal=ANTHROPIC_API_KEY=sk-ant-your-key

---
# Example: Using Sealed Secrets (recommended for GitOps)
# 1. Install sealed-secrets controller:
#    kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.0/controller.yaml
#
# 2. Create a secret file:
#    echo -n "my-secret-password" | kubectl create secret generic supernova-secrets \
#      --namespace=supernova --dry-run=client --from-file=DB_PASSWORD=/dev/stdin -o yaml > secret.yaml
#
# 3. Seal the secret:
#    kubeseal -f secret.yaml -w sealed-secret.yaml
#
# 4. Commit sealed-secret.yaml to git (it's encrypted)
#    git add sealed-secret.yaml && git commit -m "Add sealed secret"
