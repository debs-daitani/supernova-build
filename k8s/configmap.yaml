---
apiVersion: v1
kind: ConfigMap
metadata:
  name: supernova-config
  namespace: supernova
  labels:
    app: supernova-ai
data:
  # Application Configuration
  NODE_ENV: "production"
  APP_NAME: "supernova-ai"
  APP_VERSION: "1.0.0"
  APP_PORT: "3000"

  # API Configuration
  API_PREFIX: "/api/v1"
  API_RATE_LIMIT: "100"
  API_RATE_WINDOW: "15"

  # Database Configuration
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "supernova_db"
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "10"
  DB_SSL: "false"
  DB_LOGGING: "false"

  # Redis Configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_TTL: "3600"

  # Cache Configuration
  CACHE_SESSION_TTL: "300"
  CACHE_USER_PREFS_TTL: "300"
  CACHE_CONVERSATION_TTL: "120"

  # CORS Configuration
  CORS_ORIGIN: "*"
  CORS_CREDENTIALS: "true"

  # Logging Configuration
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  LOG_DIR: "/app/logs"
  LOG_MAX_SIZE: "10m"
  LOG_MAX_FILES: "7"

  # Memory & Performance
  MEMORY_RETENTION_DAYS: "90"
  CONTEXT_WINDOW_SIZE: "50"
  MAX_MESSAGE_LENGTH: "10000"
  SESSION_TIMEOUT_HOURS: "24"
  SESSION_CLEANUP_INTERVAL: "3600"

  # Performance Tuning
  WORKER_THREADS: "4"
  REQUEST_TIMEOUT: "30000"
  MAX_CONCURRENT_REQUESTS: "100"

  # Monitoring
  ENABLE_METRICS: "true"
  METRICS_PORT: "9090"
  ENABLE_TRACING: "false"
  HEALTH_CHECK_INTERVAL: "30"

  # Feature Flags
  ENABLE_SEMANTIC_SEARCH: "false"
  ENABLE_CONVERSATION_SUMMARIES: "true"
  ENABLE_KNOWLEDGE_EXTRACTION: "true"
  ENABLE_ANALYTICS: "true"
  ENABLE_DATA_EXPORT: "true"

  # Development
  DEBUG: "false"
  VERBOSE_LOGGING: "false"
  ENABLE_SWAGGER: "true"
  ENABLE_PLAYGROUND: "false"
