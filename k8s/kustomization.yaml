# Kustomize configuration for easy deployment management
# Deploy with: kubectl apply -k k8s/

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: supernova

# Resources to deploy
resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - postgres-deployment.yaml
  - redis-deployment.yaml
  - app-deployment.yaml
  - ingress.yaml
  - hpa.yaml
  - monitoring.yaml

# Common labels applied to all resources
commonLabels:
  app: supernova-ai
  managed-by: kustomize
  environment: production

# Common annotations
commonAnnotations:
  version: "1.0.0"
  documentation: "https://github.com/debs-daitani/supernova-build"

# Images to customize
images:
  - name: supernova-ai
    newName: your-registry.io/supernova-ai
    newTag: latest

# ConfigMap generator (optional)
configMapGenerator:
  - name: supernova-version
    literals:
      - VERSION=1.0.0
      - BUILD_DATE=2025-01-18
      - GIT_COMMIT=main

# Patches (optional - for environment-specific customizations)
# patchesStrategicMerge:
