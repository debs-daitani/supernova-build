# Production values for supernova
# Override default values with production-specific settings

app:
  replicaCount: 5

  image:
    tag: "v1.0.0"  # Use specific version in production

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70

  env:
    NODE_ENV: production
    LOG_LEVEL: info
    ENABLE_SWAGGER: "false"
    ENABLE_PLAYGROUND: "false"

postgresql:
  persistence:
    enabled: true
    storageClass: "fast-ssd"
    size: 50Gi

  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi

redis:
  persistence:
    enabled: true
    storageClass: "fast-ssd"
    size: 10Gi

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

  hosts:
    - host: supernova-ai.com
      paths:
        - path: /
          pathType: Prefix
    - host: api.supernova-ai.com
      paths:
        - path: /
          pathType: Prefix

  tls:
    - secretName: supernova-tls-prod
      hosts:
        - supernova-ai.com
        - api.supernova-ai.com

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 3

# Production-specific affinity rules
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app
              operator: In
              values:
                - supernova
        topologyKey: kubernetes.io/hostname
